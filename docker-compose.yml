services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic-ai-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traffic-ai-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
